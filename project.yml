name: vibedIPAManager
options:
  bundleIdPrefix: com.timmy6259
  deploymentTarget:
    iOS: "16.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  vibedIPAManager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        createIntermediateGroups: true
    dependencies:
      - package: ZIPFoundation
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.timmy6259.vibedIPAManager
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifestType: UIApplicationSceneManifestTypeMultiple
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLandscape"
      LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      SWIFT_VERSION: 5.9
      TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  vibedIPAManager:
    build:
      targets:
        vibedIPAManager: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
