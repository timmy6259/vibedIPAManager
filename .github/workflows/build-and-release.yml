name: Build and Release Alpha

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    name: Build iOS App

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild build \
            -project vibedIPAManager.xcodeproj \
            -scheme vibedIPAManager \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/vibedIPAManager.app Payload/
          zip -r -q vibedIPAManager-Alpha-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibedIPAManager-Alpha
          path: vibedIPAManager-Alpha-unsigned.ipa
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Alpha Release
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vibedIPAManager-Alpha

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-alpha
          name: Alpha ${{ github.run_number }}
          generate_release_notes: true
          prerelease: true
          files: |
            vibedIPAManager-Alpha-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}