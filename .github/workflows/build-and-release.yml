name: Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    name: Build iOS App

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild build \
            -project vibedIPAManager.xcodeproj \
            -scheme vibedIPAManager \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Debug - List build products
        run: |
          echo "=== Listing DerivedData structure ==="
          find DerivedData -type d -name "*.app" 2>/dev/null || echo "No .app found in DerivedData"
          echo "=== Full DerivedData listing ==="
          ls -R DerivedData/Build/Products/ 2>/dev/null || echo "No Products directory found"

      - name: Create IPA (unsigned)
        run: |
          set -euxo pipefail

          # Find the built app dynamically
          APP_PATH=$(find DerivedData -path '*Build/Products/Release-iphoneos/*.app' -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built app in DerivedData"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Verify the app exists
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App directory does not exist at $APP_PATH"
            exit 1
          fi
          
          # Create IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q "vibedIPAManager-${{ github.ref_name }}-unsigned.ipa" Payload/
          rm -rf Payload
          
          echo "IPA created successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibedIPAManager-${{ github.ref_name }}
          path: vibedIPAManager-${{ github.ref_name }}-unsigned.ipa
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Continuous Pre-release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vibedIPAManager-${{ github.ref_name }}

      - name: Create GitHub continuous pre-release
        uses: docker://ghcr.io/mini-bomba/create-github-release:main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Continuous Pre-releases"
          tag: "continuous"
          body: |
            This automatic pre-release is built from commit ${{ github.sha }} and was triggered by @${{ github.actor }}
            [Github Actions workflow run that built this pre-release](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Builds from all branches are available under this pre-release. The latest build for each branch is available as:
            `vibedIPAManager-{branch-name}-unsigned.ipa`
            
            Latest build: `vibedIPAManager-${{ github.ref_name }}-unsigned.ipa`
          files: |
            vibedIPAManager-${{ github.ref_name }}-unsigned.ipa
          clear_attachments: false
          prerelease: true
