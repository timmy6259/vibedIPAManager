name: Build and Release

on:
  push:
    branches:
      - main
      - develop
      - release/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    name: Build iOS App

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild build \
            -project vibedIPAManager.xcodeproj \
            -scheme vibedIPAManager \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/vibedIPAManager.app Payload/
          zip -r -q vibedIPAManager-unstable.ipa Payload/
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibedIPAManager-${{ github.ref_name }}
          path: vibedIPAManager-unstable.ipa
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Unstable Pre-release
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vibedIPAManager-${{ github.ref_name }}

      - name: Create GitHub unstable pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unstable
          name: Unstable Pre-release
          generate_release_notes: true
          prerelease: true
          overwrite_files: true
          files: |
            vibedIPAManager-unstable.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
