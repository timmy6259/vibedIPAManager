name: Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    name: Build iOS App

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild build \
            -project vibedIPAManager.xcodeproj \
            -scheme vibedIPAManager \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/vibedIPAManager.app Payload/
          zip -r -q vibedIPAManager-${{ github.ref_name }}-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibedIPAManager-${{ github.ref_name }}
          path: vibedIPAManager-${{ github.ref_name }}-unsigned.ipa
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Continuous Pre-release
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vibedIPAManager-${{ github.ref_name }}

      - name: Create GitHub continuous pre-release
        uses: docker://ghcr.io/mini-bomba/create-github-release:main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Continuous Pre-releases"
          tag: "continuous"
          body: |
            This automatic pre-release is built from commit ${{ github.sha }} and was triggered by @${{ github.actor }}
            [Github Actions workflow run that built this pre-release](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Builds from all branches are available under this pre-release. The latest build for each branch is available as:
            `vibedIPAManager-{branch-name}-unsigned.ipa`
            
            Latest build: `vibedIPAManager-${{ github.ref_name }}-unsigned.ipa`
          files: |
            vibedIPAManager-${{ github.ref_name }}-unsigned.ipa
          clear_attachments: false
          prerelease: true
