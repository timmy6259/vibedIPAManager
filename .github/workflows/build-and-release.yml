name: Build and Release

on:
  push:
    branches:
      - main
      - develop
      - release/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    name: Build iOS App

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild build \
            -project vibedIPAManager.xcodeproj \
            -scheme vibedIPAManager \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/vibedIPAManager.app Payload/
          zip -r -q vibedIPAManager-${{ github.ref_name }}-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibedIPAManager-${{ github.ref_name }}
          path: vibedIPAManager-${{ github.ref_name }}-unsigned.ipa
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vibedIPAManager-${{ github.ref_name }}

      - name: Determine release metadata
        id: release_meta
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "tag_name=v${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "release_name=Release ${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "tag_name=v${{ github.run_number }}-beta" >> $GITHUB_OUTPUT
            echo "release_name=Beta ${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v${{ github.run_number }}-$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "release_name=$BRANCH_NAME Build ${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          files: |
            vibedIPAManager-${{ github.ref_name }}-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
